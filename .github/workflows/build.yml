# The one CI pipeline: verify + build + post-build checks, then deploy on
# push to main. All quality gates live here, never in a separate workflow.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly: external-links job only (offline check:links never sees link rot).
  schedule:
    - cron: '0 6 * * 1'

# Least privilege; jobs that need more ask for it themselves.
permissions:
  contents: read

# A new push to a PR cancels its superseded run. Pushes to main each get a
# unique group (run_id), so a merge's deploy is never cancelled or skipped.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # Version intentionally omitted: read from package.json's
        # "packageManager" field via corepack, so there is exactly one place
        # the pnpm version is pinned.

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # verify runs inside the flake's devShell: its pinned Chromium and
      # fontconfig are what tests/baselines/ were captured with, so CI and
      # local runs render the screenshots identically. Playwright's own
      # downloaded browser (and Ubuntu's system fonts) would not.
      - uses: cachix/install-nix-action@v31

      - run: nix develop --command pnpm verify

      - run: pnpm run build

      # lychee audits dist/ output, so it runs after the build, not inside
      # `verify` — IMPLEMENTATION_PLAN.md §8.2/§10. CI doesn't run inside the
      # nix devShell that gives local runs the binary (flake.nix), so it's
      # installed here instead; `pnpm run check:links` stays the one command
      # that actually runs the check, same as a local run.
      - uses: taiki-e/install-action@v2
        with:
          tool: lychee

      - run: pnpm run check:links

      # Lighthouse CI audits dist/ output via `astro preview`, so it runs
      # after the build too, immediately after check:links — both post-build
      # per §10's order (IMPLEMENTATION_PLAN.md §8.5). A GitHub Action, not
      # an npm dependency, same reasoning as lychee above (AD-11's own
      # JS-budget discipline shouldn't grow node_modules to measure it).
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.cjs'

      # The exact dist/ every check above just passed is what ships — the
      # deploy job never rebuilds. PR runs skip this and never deploy.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # IMPLEMENTATION_PLAN.md §10: rsync into releases/<sha>/, swap `current`,
  # keep five. Server layout, deploy user and Caddy config are Ansible's
  # (server-conf, roles/blog) — this job only ever writes releases. Rollback
  # is documented there too.
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    # Queue, never cancel: a cancelled run could stop between rsync and swap.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload release and switch current
        env:
          TARGET: deploy@${{ vars.DEPLOY_HOST }}
          ROOT: /srv/www/blog
          SHA: ${{ github.sha }}
        run: |
          rsync -rz --delete --chmod=D755,F644 dist/ "$TARGET:$ROOT/releases/$SHA/"
          ssh "$TARGET" "cd $ROOT && ln -sfn releases/$SHA current.tmp && mv -T current.tmp current && ls -1t releases | tail -n +6 | xargs -r -I{} rm -rf releases/{}"

      # A green rsync doesn't prove Caddy is serving. URL mirrors SITE_URL in
      # src/consts.ts.
      - name: Smoke-check the live site
        run: |
          for path in / /rss.xml; do
            curl -fsS --retry 3 --retry-all-errors -o /dev/null "https://obernhumer.com$path"
          done

  # Weekly external link-rot check. Opens one "Broken external links" issue,
  # updating it on later runs instead of opening duplicates; close it once fixed.
  external-links:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: taiki-e/install-action@v2
        with:
          tool: lychee

      - id: lychee
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids github.com rate limits
        run: lychee 'dist/**/*.html' --offline=false --format markdown --output links.md || echo "broken=true" >> "$GITHUB_OUTPUT"

      - if: steps.lychee.outputs.broken == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Broken external links"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file links.md
          else
            gh issue create --title "$title" --body-file links.md
          fi
